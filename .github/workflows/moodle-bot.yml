name: Moodle bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a bit)
  workflow_dispatch:          # allows a manual "Run workflow" button

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: moodle-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          MOODLE_ICAL_URL: ${{ secrets.MOODLE_ICAL_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python moodle_bot.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "moodle-bot"
            git config user.email "moodle-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update bot state"
            git push
          fi
